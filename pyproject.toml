[project]
name = "support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"
