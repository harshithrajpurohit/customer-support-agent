# ==============================================================================
# Category 2: refunds (12 scenarios)
# ==============================================================================
- id: scenario_11
  name: "Eligible refund within window (1002)"
  category: "refunds"
  customer_id: 1
  turns:
    - "I want to request a refund for order 1002. The running shoes do not fit well."
  expect:
    intent: "refund"
    tools_called: ["check_refund_eligibility", "create_refund_request"]
    outcome: "awaiting_approval"
    db:
      refund_pending_for_order: 1002
    reply_must_not_contain: ["refund has been processed", "money has been credited"]

- id: scenario_12
  name: "Eligible refund for another customer (1008)"
